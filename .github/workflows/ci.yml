name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: pip install -e .
      - run: python -m compileall -q src
      - run: python -c "from nubios.core.assistant import Assistant; from nubios.ai.provider import MockAIProvider; from nubios.config.settings import Settings; print('NubiOS core import: OK')"
      - run: pytest
