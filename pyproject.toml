[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "nubios"
version = "0.1.0"
description = "A modular, privacy-first AI desktop assistant for Windows."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "PySide6>=6.8,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pyinstaller>=6.0"]
voice = ["faster-whisper>=1.1"]

[project.scripts]
nubios = "nubios.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
